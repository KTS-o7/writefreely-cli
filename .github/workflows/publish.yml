name: Publish to PyPI

# Runs only when a version tag is pushed, e.g.:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check the tag matches __version__
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/writefreely_cli.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version in src/writefreely_cli.py"
            exit 1
          fi

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  # Trusted Publishing (OIDC): no API token. The PyPI trusted publisher is
  # bound to this workflow file name and the `pypi` environment.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/writefreely-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # --check-url skips files PyPI already has, so re-running a tag is safe.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
